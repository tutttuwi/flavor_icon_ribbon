name: Feature request
description: A change to the CLI, the YAML config, or the drawing API.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do with the current CLI or drawing API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want, including any YAML or API shape.
    validations:
      required: true
